services:
  web:
    build: .
    ports:
      # Reachable from this machine only: the web interface and REST API have no login.
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Source code, for hot reload.
      - .:/app
      # Keep the container's own dependencies and build cache.
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      # Tasks are stored here as a JSON file, unless DATABASE_URL is set.
      - ./data:/app/data

  # Optional Postgres storage. Start it with:
  #   docker compose --profile postgres up --build
  # and set DATABASE_URL in .env (see .env.example).
  db:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: tudu
      POSTGRES_PASSWORD: tudu
      POSTGRES_DB: tudu
    # Reachable from this machine only, for the Postgres test runs.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tudu -d tudu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  node_modules:
  next_cache:
  postgres_data:
