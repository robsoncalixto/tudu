services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Source code, for hot reload.
      - .:/app
      # Keep the container's own dependencies and build cache.
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      # Tasks are stored here as a JSON file (no database).
      - ./data:/app/data

volumes:
  node_modules:
  next_cache:
